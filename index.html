<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .radio-container {
            display: flex;
            gap: 15px;
        }

        .radio-option {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .radio-option:hover {
            border-color: #6366f1;
            background: #f8faff;
        }

        .radio-option input {
            accent-color: #4f46e5;
        }

        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
        }

        .links a {
            text-decoration: none;
            color: #4f46e5;
            font-size: 14px;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 28px 22px;
            }

            .radio-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <div class="icon">
                    👤
                </div>

                <h1>Personal Information</h1>

                <p>
                    Please enter your personal information below
                </p>

            </div>

            <form action="FormServlet" method="post">

                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="Enter your first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Enter your last name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="birthDate">
                        Birth Date
                    </label>

                    <input
                        type="text"
                        id="birthDate"
                        name="birthDate"
                        placeholder="MM/DD/YYYY"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Sex
                    </label>

                    <div class="radio-container">

                        <div class="radio-option">

                            <input
                                type="radio"
                                id="male"
                                name="sex"
                                value="Male"
                                required
                            >

                            <label for="male">
                                Male
                            </label>

                        </div>


                        <div class="radio-option">

                            <input
                                type="radio"
                                id="female"
                                name="sex"
                                value="Female"
                            >

                            <label for="female">
                                Female
                            </label>

                        </div>

                    </div>

                </div>


                <button type="submit" class="submit-btn">
                    Submit Information
                </button>

            </form>


            <div class="links">
                <a href="ReadCookie">🍪 Read Cookies</a>
                <a href="VisitCounter">📊 Visit Counter</a>
            </div>

        </div>
        <div class="footer">
            Java Servlet • Web Technologies Lab
        </div>

    </div>

</body>

</html>
