
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Information Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #FFF8F5, #FCE7F3, #F3E8FF);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: #594052;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(190, 120, 155, 0.15);
            border: 1px solid #F8DCEB;
        }

        .label {
            color: #BE789B;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        h1 {
            color: #874D70;
            font-size: 27px;
            margin: 15px 0;
        }

        .description {
            color: #91798A;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #76566C;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #E8CDDE;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #FFFAFD;
            color: #594052;
            transition: 0.3s;
        }

        input:focus {
            border-color: #BE789B;
            box-shadow: 0 0 0 3px rgba(190, 120, 155, 0.12);
        }

        .radio-group {
            display: flex;
            gap: 25px;
            padding: 10px 0;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #76566C;
        }

        .radio-option input {
            accent-color: #BE789B;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #BE789B, #A76C91);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(190, 120, 155, 0.25);
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #B69AAA;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="label">Java Web Application</div>

        <h1>Person Information</h1>

        <p class="description">
            Please complete the form below with your personal information.
        </p>

        <form action="bean.jsp" method="POST">

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName"
                       name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName"
                       name="lastName" required>
            </div>

            <div class="form-group">
                <label for="birthDate">Birth Date</label>
                <input type="date" id="birthDate"
                       name="birthDate" required>
            </div>

            <div class="form-group">
                <label>Sex</label>

                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="sex"
                               value="Male" required>
                        Male
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="sex"
                               value="Female">
                        Female
                    </label>
                </div>
            </div>

            <button type="submit">Submit Information</button>

        </form>

        <footer>Person Information Form</footer>

    </main>

</body>
</html>
